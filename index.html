<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./CSS/style.css">
</head>
<body class="bg-primary-custom">

    <div class="container d-flex flex-column justify-content-center align-items-center min-vh-100 py-4">
        
        <div class="text-center text-white mb-4">
            <div class="bg-white bg-opacity-25 p-3 rounded-4 d-inline-block mb-2 shadow-sm">
                <i class="bi bi-calendar-check fs-1 text-white"></i>
            </div>
            <h1 class="h3 fw-bold">Reserva de Recursos</h1>
            <p class="text-light opacity-75 small">Acesse sua conta para continuar</p>
        </div>

        <div class="card border-0 shadow-lg rounded-4 w-100" style="max-width: 450px;">
            <div class="card-body p-4 p-md-5">
                
                <span class="d-block text-uppercase text-muted small fw-semibold mb-3">Identificação</span>

                <form action="./PHP/logar.php" method="POST">
                    
                    <div class="mb-3">
                        <label for="usuario" class="form-label text-secondary small fw-medium">Usuário ou E-mail</label>
                        <div class="input-group bg-light rounded-3 overflow-hidden border">
                            <span class="input-group-text bg-transparent border-0 text-muted ps-3">
                                <i class="bi bi-person"></i>
                            </span>
                            <input type="text" class="form-control bg-transparent border-0 py-2 shadow-none" id="usuario" name="email" placeholder="Digite seu usuário ou e-mail" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="senha" class="form-label text-secondary small fw-medium">Senha</label>
                        <div class="input-group bg-light rounded-3 overflow-hidden border">
                            <span class="input-group-text bg-transparent border-0 text-muted ps-3">
                                <i class="bi bi-lock"></i>
                            </span>
                            <input type="password" class="form-control bg-transparent border-0 py-2 shadow-none" id="senha" name="senha" placeholder="Digite sua senha" required>
                        </div>
                    </div>
                   
                    <button type="submit" class="btn btn-secondary-custom w-100 py-3 fw-semibold rounded-3 text-white shadow-sm mb-3">
                        Entrar <i class="bi bi-arrow-right ms-1"></i>
                    </button>

                    <div class="text-center">
                        <span class="text-muted small">Ainda não tem uma conta?</span>
                        <a href="cadastro.html" class="text-decoration-none fw-semibold small ms-1 text-primary">Cadastre-se</a>
                    </div>
                </form>

                <hr class="my-4 text-muted opacity-25">

            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
