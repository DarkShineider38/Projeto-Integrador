<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body class="bg-primary-custom">

    <div class="container d-flex flex-column justify-content-center align-items-center min-vh-100 py-4">
        

        <div class="text-center text-white mb-3">
            <div class="bg-white bg-opacity-25 p-3 rounded-4 d-inline-block mb-2 shadow-sm">
                <i class="bi bi-person-plus fs-1 text-white"></i>
            </div>
            <h1 class="h3 fw-bold">Crie sua Conta</h1>
            <p class="text-light opacity-75 small">Preencha os dados para acessar o sistema</p>
        </div>

      
        <div class="card border-0 shadow-lg rounded-4 w-100" style="max-width: 450px;">
            <div class="card-body p-4 p-md-4">
                
                <form action="./PHP/cadastrarUser.php" method="POST">
                    
                    <div class="mb-3">
                        <label for="nome" class="form-label text-secondary small fw-medium">Nome Completo</label>
                        <div class="input-group bg-light rounded-3 overflow-hidden border">
                            <span class="input-group-text bg-transparent border-0 text-muted ps-3"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control bg-transparent border-0 py-2 shadow-none" id="nome" name="nome" placeholder="Seu nome" required>
                        </div>
                    </div>

                    
                    <div class="mb-3">
                        <label for="email" class="form-label text-secondary small fw-medium">E-mail ou Usuário</label>
                        <div class="input-group bg-light rounded-3 overflow-hidden border">
                            <span class="input-group-text bg-transparent border-0 text-muted ps-3"><i class="bi bi-envelope"></i></span>
                            <input type="text" class="form-control bg-transparent border-0 py-2 shadow-none" id="email" name="email" placeholder="seu.email@empresa.com" required>
                        </div>
                    </div>

                    
                    <div class="mb-3">
                        <label for="senha" class="form-label text-secondary small fw-medium">Senha</label>
                        <div class="input-group bg-light rounded-3 overflow-hidden border">
                            <span class="input-group-text bg-transparent border-0 text-muted ps-3"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control bg-transparent border-0 py-2 shadow-none" id="senha" name="senha" placeholder="Sua senha" required>
                        </div>
                    </div>

                    
                    <div class="mb-4">
                        <label for="senhaConfirmacao" class="form-label text-secondary small fw-medium">Confirmar Senha</label>
                        <div class="input-group bg-light rounded-3 overflow-hidden border">
                            <span class="input-group-text bg-transparent border-0 text-muted ps-3"><i class="bi bi-lock-fill"></i></span>
                            <input type="password" class="form-control bg-transparent border-0 py-2 shadow-none" id="senhaConfirmacao" name="senhaConfirmacao" placeholder="Confirme a senha" required>
                        </div>
                    </div>

                    
                    <button type="submit" class="btn btn-secondary-custom w-100 py-3 fw-semibold rounded-3 text-white shadow-sm mb-3">
                        Cadastrar <i class="bi bi-check-lg ms-1"></i>
                    </button>

                    
                    <div class="text-center">
                        <span class="text-muted small">Já tem uma conta?</span>
                        <a href="index.html" class="text-decoration-none fw-semibold small ms-1 text-primary">Faça login</a>
                    </div>
                </form>

            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
