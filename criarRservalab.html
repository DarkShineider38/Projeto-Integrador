<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReservaFácil - Nova Reserva de Sala</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body class="bg-light">

    <!-- Topo -->
    <div class="bg-primary-custom text-white py-4 px-3 rounded-bottom-5 shadow mb-4">
        <div class="container max-w-custom d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center gap-2">
                <div class="bg-white bg-opacity-25 p-2 rounded-3">
                    <i class="bi bi-calendar-event text-white"></i>
                </div>
                <span class="fw-bold fs-5">ReservaFácil</span>
            </div>
            <a href="homepage.html" class="text-white text-decoration-none small"><i class="bi bi-arrow-left"></i> Voltar</a>
        </div>
    </div>

    <!-- Formulário -->
    <div class="container max-w-custom pb-5">
        <div class="card border-0 shadow-lg rounded-4">
            <div class="card-body p-4 p-md-4">
                
                <div class="d-flex align-items-center gap-2 mb-3">
                    <div class="bg-primary text-white p-2 rounded-3">
                        <i class="bi bi-people"></i>
                    </div>
                    <div>
                        <h4 class="fw-bold text-dark mb-0 fs-5">Reservar Sala</h4>
                        <p class="text-muted small mb-0">Preencha os dados para agendar o espaço</p>
                    </div>
                </div>

                <hr class="text-muted opacity-25 mb-4">

                <form action="PHP/reservaSalas.php" method="POST">
                    
                    <!-- ID Sala / Laboratório -->
                    <div class="mb-3">
                        <label for="id_sala" class="form-label text-secondary small fw-medium">ID da Sala ou Laboratório</label>
                        <div class="input-group bg-light rounded-3 overflow-hidden border">
                            <span class="input-group-text bg-transparent border-0 text-muted ps-3"><i class="bi bi-door-open"></i></span>
                            <input type="text" class="form-control bg-transparent border-0 py-2 shadow-none" id="id_sala" name="id_sala" placeholder="Ex: 1" required>
                        </div>
                    </div>

                    <!-- ID Usuário -->
                    <div class="mb-3">
                        <label for="id_usuario" class="form-label text-secondary small fw-medium">ID do Usuário</label>
                        <div class="input-group bg-light rounded-3 overflow-hidden border">
                            <span class="input-group-text bg-transparent border-0 text-muted ps-3"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control bg-transparent border-0 py-2 shadow-none" id="id_usuario" name="id_usuario" placeholder="Seu ID de usuário" required>
                        </div>
                    </div>

                    <!-- Data da Reserva -->
                    <div class="mb-3">
                        <label for="data_reserva" class="form-label text-secondary small fw-medium">Data da Reserva</label>
                        <div class="input-group bg-light rounded-3 overflow-hidden border">
                            <span class="input-group-text bg-transparent border-0 text-muted ps-3"><i class="bi bi-calendar"></i></span>
                            <input type="date" class="form-control bg-transparent border-0 py-2 shadow-none" id="data_reserva" name="data_reserva" required>
                        </div>
                    </div>

                    <!-- Horário Início e Fim (Lado a Lado) -->
                    <div class="row mb-4">
                        <div class="col-6">
                            <label for="horario_inicio" class="form-label text-secondary small fw-medium">Início</label>
                            <input type="time" class="form-control bg-light border py-2 rounded-3 shadow-none" id="horario_inicio" name="horario_inicio" required>
                        </div>
                        <div class="col-6">
                            <label for="horario_final" class="form-label text-secondary small fw-medium">Fim</label>
                            <input type="time" class="form-control bg-light border py-2 rounded-3 shadow-none" id="horario_final" name="horario_final" required>
                        </div>
                    </div>

                    <!-- Botão Salvar -->
                    <button type="submit" class="btn btn-secondary-custom w-100 py-3 fw-semibold rounded-3 text-white shadow-sm">
                        Confirmar Reserva <i class="bi bi-check-lg ms-1"></i>
                    </button>

                </form>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
