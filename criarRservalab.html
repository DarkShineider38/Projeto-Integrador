<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservar Sala</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../CSS/style.css">
</head>
<body class="bg-light">

    <div class="bg-primary-custom text-white pb-5 pt-4 px-3 rounded-bottom-5 shadow">
        <div class="container max-w-custom">
            <div class="d-flex align-items-center gap-2 mb-2">
                <a href="homepage.html" class="btn btn-dark-glass rounded-circle p-2 text-white border-0" style="width: 40px; height: 40px;">
                    <i class="bi bi-arrow-left"></i>
                </a>
                <span class="fw-bold fs-5">Reservar Sala</span>
            </div>
            <p class="opacity-75 small mb-0">Preencha os dados para agendar a sala ou laboratório</p>
        </div>
    </div>

    <div class="container max-w-custom mt-n4 pb-5">
        <div class="card border-0 shadow-lg rounded-4">
            <div class="card-body p-4">
                <form method="post" action="./PHP/reservaSalas.php">

                    <div class="mb-3">
                        <label class="form-label text-secondary small fw-medium">N° de Registro da Sala</label>
                        <div class="input-group bg-light rounded-3 overflow-hidden border">
                            <span class="input-group-text bg-transparent border-0 text-muted ps-3">
                                <i class="bi bi-door-open"></i>
                            </span>
                            <input type="text" class="form-control bg-transparent border-0 py-2 shadow-none" name="salaLab" placeholder="Digite o N° de registro da sala">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-6 mb-3">
                            <label class="form-label text-secondary small fw-medium">Data Início</label>
                            <div class="input-group bg-light rounded-3 overflow-hidden border">
                                <span class="input-group-text bg-transparent border-0 text-muted ps-3">
                                    <i class="bi bi-calendar-event"></i>
                                </span>
                                <input type="date" class="form-control bg-transparent border-0 py-2 shadow-none" name="DtaInicio">
                            </div>
                        </div>
                        <div class="col-6 mb-3">
                            <label class="form-label text-secondary small fw-medium">Data Término</label>
                            <div class="input-group bg-light rounded-3 overflow-hidden border">
                                <span class="input-group-text bg-transparent border-0 text-muted ps-3">
                                    <i class="bi bi-calendar-check"></i>
                                </span>
                                <input type="date" class="form-control bg-transparent border-0 py-2 shadow-none" name="DtaFiml">
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-6 mb-3">
                            <label class="form-label text-secondary small fw-medium">Horário Início</label>
                            <div class="input-group bg-light rounded-3 overflow-hidden border">
                                <span class="input-group-text bg-transparent border-0 text-muted ps-3">
                                    <i class="bi bi-clock"></i>
                                </span>
                                <input type="time" class="form-control bg-transparent border-0 py-2 shadow-none" name="tempInicio">
                            </div>
                        </div>
                        <div class="col-6 mb-3">
                            <label class="form-label text-secondary small fw-medium">Horário Término</label>
                            <div class="input-group bg-light rounded-3 overflow-hidden border">
                                <span class="input-group-text bg-transparent border-0 text-muted ps-3">
                                    <i class="bi bi-clock-history"></i>
                                </span>
                                <input type="time" class="form-control bg-transparent border-0 py-2 shadow-none" name="tempFim">
                            </div>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-secondary small fw-medium">Matrícula</label>
                        <div class="input-group bg-light rounded-3 overflow-hidden border">
                            <span class="input-group-text bg-transparent border-0 text-muted ps-3">
                                <i class="bi bi-person-badge"></i>
                            </span>
                            <input type="text" class="form-control bg-transparent border-0 py-2 shadow-none" name="matricula" placeholder="Digite sua matrícula">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-secondary-custom w-100 py-3 fw-semibold rounded-3 text-white shadow-sm">
                        Reservar <i class="bi bi-check-circle ms-1"></i>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
